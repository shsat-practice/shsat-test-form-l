<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHSAT Practice — ELA &amp; Mathematics</title>
<style>
:root{
  --ink:#16202e; --ink-soft:#5a6579; --ink-faint:#8b94a5;
  --rule:#dde3ec; --canvas:#eef1f6; --card:#fff;
  --accent:#1f5aa8; --accent-soft:#e9f0fa; --accent-deep:#16416f;
  --amber:#8a6114; --amber-bg:#fdf3dd; --amber-line:#e7cf9a;
  --danger:#b42318; --ok:#15803d;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--ui);
     font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.wrap.wide{max-width:1400px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.bar-in{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;
        align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:14px;font-weight:600;letter-spacing:.02em}
.brand span{color:#93a3bb;font-weight:500}
.count{font-size:14px;color:#c2ccdb;font-variant-numeric:tabular-nums}
.track{height:3px;background:#0d1725}
.track i{display:block;height:100%;background:#5b9bd8;transition:width .25s ease}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
      padding:32px 40px;margin:26px 0}
h1{font-size:28px;line-height:1.25;margin:0 0 14px}
h2{font-size:16px;font-weight:700;margin:24px 0 10px}
.lede{color:var(--ink-soft);margin:0 0 20px}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.qnum{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink-faint)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
       color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line);
       padding:2px 8px;border-radius:4px}

/* ---------- split layout ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
       align-items:start;margin:22px 0}
.pane{background:var(--card);border:1px solid var(--rule);border-radius:10px;
      display:flex;flex-direction:column;min-height:0}
.pane.passage{position:sticky;top:64px;max-height:calc(100vh - 92px)}
.pane.qs{padding:28px 32px}
.ptabs{display:flex;gap:3px;padding:7px 8px 0;border-bottom:1px solid var(--rule);
       flex-wrap:wrap;flex:none;background:#f7f9fc;border-radius:10px 10px 0 0}
.ptab{flex:none;border:1px solid transparent;border-bottom:none;background:none;
      padding:7px 10px;border-radius:7px 7px 0 0;font-size:12px;font-weight:600;
      color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.ptab:hover{background:#eef2f8;color:var(--ink)}
.ptab.on{background:#fff;border-color:var(--rule);color:var(--ink);
         box-shadow:0 1px 0 #fff;margin-bottom:-1px}
.ptab.done{color:var(--ink-faint);cursor:not-allowed;opacity:.65}
.ptab.done:hover{background:none;color:var(--ink-faint)}
.ptab .lk{font-size:11px;margin-right:4px}
.pbody{overflow-y:auto;padding:22px 30px 28px;font-family:var(--serif);
       font-size:16.5px;line-height:1.62;flex:1;min-height:0}
.pnotice{margin:0 0 14px;padding:9px 13px;border-radius:7px;background:var(--amber-bg);
         border:1px solid var(--amber-line);font-family:var(--ui);font-size:13px;
         color:var(--amber);display:flex;justify-content:space-between;gap:10px;
         align-items:center;flex-wrap:wrap}
.pnotice button{border:1px solid var(--amber-line);background:#fff;color:var(--amber);
       border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}

/* ---------- passage typography ---------- */
.ptitle{text-align:center;font-size:19px;margin:6px 0 2px;font-family:var(--serif)}
.byline{text-align:center;font-style:italic;margin-bottom:16px;font-size:15px}
.phead{font-size:15.5px;font-style:italic;margin:20px 0 6px}
.pintro{font-style:italic;border-left:3px solid var(--rule);padding-left:14px;
        margin:6px 0 18px;color:#39445a}
.ppara{margin:11px 0;display:flex;gap:10px;align-items:flex-start}
.pnum{flex:none;width:20px;font-weight:700;font-size:13px;color:var(--ink-faint);
      font-family:var(--ui);padding-top:3px}
.pcredit,.pnote{font-size:13.5px;color:var(--ink-soft);font-style:italic;margin:12px 0 0}
.pnote{font-style:normal}
.stanza{margin:16px 0}
@media (max-width:900px){.stanza{font-size:14.5px}}
@media (max-width:620px){.stanza{font-size:12.5px;line-height:1.5}}
@media (max-width:430px){.stanza{font-size:11px}.pbody{padding-left:16px;padding-right:16px}}
.pline{display:flex;gap:12px}
.lnum{flex:none;width:22px;text-align:right;color:var(--ink-faint);font-size:12.5px;
      font-family:var(--ui);padding-top:3px}
.pfig{margin:18px 0;text-align:center}
.pfig img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:4px}

/* ---------- question body ---------- */
.stem{font-size:18.5px;line-height:1.58}
.stem p{margin:0 0 12px}
.stem ul{margin:10px 0 12px;padding-left:22px}
.stem blockquote{margin:12px 0;padding:12px 16px;background:#f7f9fc;
       border-left:3px solid #c3ccd9;border-radius:0 6px 6px 0;font-family:var(--serif);
       font-size:17px;line-height:1.55}
.disp{text-align:center;margin:18px 0;font-size:19px}
.disp.stack{line-height:2}
.qfig{text-align:center;margin:16px 0}
.stem svg{max-width:100%;height:auto}
.grid-in{margin-top:22px}
.grid-in label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);
     letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.grid-in input{width:230px;font-size:24px;font-family:inherit;font-weight:600;
     padding:11px 14px;border:1.5px solid var(--rule);border-radius:8px;color:var(--ink)}
.grid-in input:focus{outline:none;border-color:var(--accent);
     box-shadow:0 0 0 3px rgba(47,111,176,.16)}
.hint{font-size:13px;color:var(--ink-faint);margin-top:9px}
.qfig svg{max-width:min(100%,470px);height:auto}
.frac{display:inline-block;vertical-align:middle;text-align:center;
      font-size:.92em;line-height:1.15;margin:0 2px}
.frac .num{display:block;padding:0 3px}
.frac .den{display:block;border-top:1px solid currentColor;padding:0 3px}
.ovl{border-top:1px solid currentColor}
sup{font-size:.72em;vertical-align:super;line-height:0}
sub{font-size:.72em;vertical-align:sub;line-height:0}
.tbl-title{text-align:center;font-size:14.5px;margin-bottom:7px;font-weight:600}
table.data{border-collapse:collapse;margin:0 auto 14px}
table.data th,table.data td{border:1px solid var(--ink);padding:5px 14px;
      font-size:15px;text-align:center}

/* ---------- choices ---------- */
.choices{margin-top:22px;display:flex;flex-direction:column;gap:9px}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
        background:#fff;border:1.5px solid var(--rule);border-radius:8px;
        padding:13px 16px;cursor:pointer;font-size:17.5px;line-height:1.5;color:var(--ink);
        transition:border-color .12s,background .12s}
.choice:hover{border-color:#b9c4d4;background:#fafbfd}
.choice .ltr{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #c3ccd9;
        display:flex;align-items:center;justify-content:center;font-size:13.5px;
        font-weight:700;color:var(--ink-soft);margin-top:1px}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.choice:focus-visible{outline:3px solid #9dc3ec;outline-offset:2px}

/* ---------- actions ---------- */
.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;
      margin-top:26px;padding-top:18px;border-top:1px solid var(--rule)}
.note{font-size:13px;color:var(--ink-faint);max-width:380px}
.btns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:none;border-radius:8px;padding:13px 24px;font-size:16px;font-weight:600;
     cursor:pointer;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-deep)}
.arrow.back{background:#fff;color:var(--ink-soft);border:1.5px solid var(--rule)}
.arrow.back:hover{background:#f3f5f9;color:var(--ink);border-color:var(--ink-soft)}
.setpos{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);border-left:1px solid var(--rule);padding-left:10px}
@media (max-width:760px){.setpos{border-left:0;padding-left:0}}
.btn-ghost{background:none;color:var(--ink-soft);border:1.5px solid var(--rule);
     padding:12px 18px}
.btn-ghost:hover{background:#f3f5f9;color:var(--ink)}
.btn:focus-visible{outline:3px solid #9dc3ec;outline-offset:2px}
.arrow{width:60px;height:60px;border-radius:50%;border:none;background:var(--accent);
     color:#fff;font-size:27px;line-height:1;cursor:pointer;display:flex;
     align-items:center;justify-content:center;transition:background .12s,transform .12s}
.arrow:hover{background:var(--accent-deep);transform:translateX(2px)}
.arrow.finish{background:var(--ok)}
.arrow.finish:hover{background:#136c34;transform:none}
.arrow:focus-visible{outline:3px solid #9dc3ec;outline-offset:3px}

/* ---------- start / results ---------- */
.rules{list-style:none;padding:0;margin:0 0 6px}
.rules li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);
      font-size:16px;color:var(--ink-soft)}
.rules li:last-child{border-bottom:none}
.rules b{color:var(--ink);font-weight:650;flex:none;width:150px}
.picks{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 6px}
.pick{flex:1;min-width:210px;text-align:left;background:#fff;border:1.5px solid var(--rule);
      border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .12s,background .12s}
.pick:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick b{display:block;font-size:17px;margin-bottom:3px}
.pick span{font-size:13.5px;color:var(--ink-faint)}
.stats{display:flex;gap:34px;margin:6px 0 22px;flex-wrap:wrap}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint)}
.stat .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
table.sheet{width:100%;border-collapse:collapse;margin-top:6px}
table.sheet th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-faint);border-bottom:1.5px solid var(--rule);padding:8px 10px}
table.sheet td{border-bottom:1px solid #eef1f6;padding:8px 10px;font-size:15.5px;
      font-variant-numeric:tabular-nums}
table.sheet td.q{color:var(--ink-faint);width:52px}
.blank{color:var(--danger);font-weight:650}
.right{color:var(--ok);font-weight:650}
.wrong{color:var(--danger);font-weight:650}
.missed{font-size:16.5px;font-weight:600;color:var(--danger);margin:0 0 4px;
      font-variant-numeric:tabular-nums;line-height:1.6}
.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 26px}
@media(max-width:800px){.sheetgrid{grid-template-columns:1fr}}

/* ---------- dialog / print ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(16,24,38,.55);
      display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:12px;padding:26px 28px;max-width:430px;width:100%;
      box-shadow:0 18px 50px rgba(10,18,32,.3)}
.modal-card h3{margin:0 0 8px;font-size:18px}
.modal-card p{margin:0 0 20px;color:var(--ink-soft);font-size:15px}
.modal-btns{display:flex;justify-content:flex-end;gap:10px}
.printhead{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.ph-title{font-size:15px;font-weight:700}
.ph-meta{font-size:13px;color:var(--ink-soft);margin-top:3px}
.namefield{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.namefield label{font-size:13px;font-weight:600;color:var(--ink-soft);width:104px}
.namefield input{flex:1;min-width:210px;max-width:300px;font-family:var(--ui);font-size:15px;
      padding:8px 12px;border:1.5px solid #c3ccd9;border-radius:8px}
.namefield input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tip{font-size:12.5px;color:var(--ink-faint);margin-top:10px}

@media(max-width:900px){
  .split{grid-template-columns:1fr}
  .pane.passage{position:static;max-height:52vh}
  .pane.qs{padding:22px 20px}
}
@media(max-width:640px){
  .card{padding:22px 18px}
  .bar-in{padding:9px 14px}.wrap{padding:0 12px}
  h1{font-size:22px}.stem,.choice{font-size:16.5px}
  .actions{flex-direction:column;align-items:stretch}
  .btns{justify-content:space-between}.note{max-width:none}
  .arrow{width:54px;height:54px;font-size:25px}
  .rules b{width:auto}
  .rules li{flex-direction:column;gap:2px}
}
@media print{
  @page{margin:14mm}
  .bar,.track,.actions,.noprint,.modal,.namefield{display:none!important}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0}
  .card{border:none;margin:0;padding:0;border-radius:0}
  h1{font-size:18px;margin-bottom:6px}
  h2{font-size:13px;margin:14px 0 6px}
  .stats{gap:24px;margin:4px 0 12px}.stat .v{font-size:19px}
  .sheetgrid{gap:0 18px}
  table.sheet td,table.sheet th{padding:2.5px 7px;font-size:11px}
  tr{page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- content helpers ---------- */
.stanzagap{height:14px}
.tw{margin:16px 0;text-align:center}
.tt{font-family:var(--ui);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:7px}
table.data{border-collapse:collapse;margin:0 auto;font-size:16px}
table.data th,table.data td{border:1px solid #b9c4d1;padding:6px 16px;text-align:center}
table.data th{background:#eef2f7;font-weight:600}
p.ent{font-size:15.5px;color:var(--ink-soft);margin:10px 0 4px}
.rep{border-top:1.4px solid currentColor;padding:0 1px}
.rad{border-top:1.1px solid currentColor;padding:0 2px 0 1px;margin-left:-1px}

/* ---------- answer eliminator ---------- */
.pickwrap{display:flex;align-items:flex-start;gap:13px;flex:1;text-align:left;
  background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.crow{display:flex;align-items:flex-start;gap:13px;width:100%;
  border:1.5px solid var(--rule);border-radius:11px;padding:15px 17px;background:#fff;
  position:relative}
.crow:hover{border-color:#b9c4d4;background:#fafbfd}
.crow.on{border-color:var(--accent);background:var(--accent-soft)}
.crow.on .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.crow .ct{flex:1}
.elim{flex:none;width:30px;height:30px;border-radius:50%;border:1.4px solid var(--rule);
      background:#fff;color:var(--ink-faint);font-family:var(--ui);font-size:15px;
      line-height:1;cursor:pointer;align-self:center;margin-left:10px;padding:0}
.elim:hover{border-color:#b42318;color:#b42318;background:#fdf3f2}
.crow.struck .ct,.crow.struck .ltr{text-decoration:line-through;opacity:.42}
.crow.struck .elim{border-color:#b42318;color:#b42318;background:#fdf3f2}
.elimhint{font-size:13.5px;color:var(--ink-faint);font-family:var(--ui);margin:10px 0 0}
.crow .box{flex:none;width:21px;height:21px;border:1.7px solid var(--rule);border-radius:4px;
  background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;
  color:#fff;align-self:center}
.crow.on .box{background:var(--accent);border-color:var(--accent)}
.pickmsg{font-family:var(--ui);font-size:13.5px;margin-top:10px;color:var(--ink-soft)}
.pickmsg.full{color:#15803d}

/* ---------- tech-enhanced items ---------- */
table.rt{border-collapse:collapse;margin:16px auto 4px;font-size:16px;min-width:74%}
table.rt th,table.rt td{border:1px solid #b9c4d1;padding:10px 14px;text-align:center}
table.rt th{background:#eef2f7;font-weight:600;font-family:var(--ui);font-size:14px}
table.rt td.lab{text-align:left;font-size:17px}
.rdo{width:21px;height:21px;border:1.7px solid var(--rule);border-radius:50%;background:#fff;
     cursor:pointer;display:inline-block;padding:0}
.rdo.on{border-color:var(--accent);border-width:6px}
.ddline{margin:14px 0;font-size:18px;line-height:1.7}
.ddline select{font:inherit;font-size:16px;padding:5px 8px;border:1.5px solid var(--rule);
     border-radius:6px;background:#fff;color:var(--ink);margin:0 4px}
.tray{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 6px}
.tok{font-family:var(--ui);font-size:15px;font-weight:600;color:var(--accent);
     border:1.5px solid var(--accent);border-radius:7px;padding:7px 15px;background:#fff;
     cursor:pointer}
.tok.held{background:var(--accent);color:#fff}
.tok.used{opacity:.3;cursor:default}
.dropcell{min-width:96px;height:38px;border:1.6px dashed #9fb0c4;border-radius:6px;
     background:#fbfcfe;cursor:pointer;display:flex;align-items:center;justify-content:center;
     font-weight:600;color:var(--accent);margin:0 auto}
.dropcell.filled{border-style:solid;border-color:var(--accent);background:#eef4fb}
.dropcell.target{border-color:var(--accent);background:#e8f0fa}
.exprbox{width:100%!important;font-size:22px;font-family:var(--serif);padding:12px 14px;
     border:1.5px solid var(--rule);border-radius:8px;color:var(--ink);box-sizing:border-box}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px;
     border:1.5px solid var(--accent);border-radius:9px;padding:9px;background:#f7f9fc}
.pal button{font-family:var(--serif);font-size:18px;padding:9px 0;background:#eef2f7;
     border:1px solid #d3dbe5;border-radius:6px;cursor:pointer;color:var(--ink)}
.pal button.util{font-family:var(--ui);font-size:14px;background:#fff}
@media (max-width:620px){.pal{grid-template-columns:repeat(5,1fr)}}

/* ---------- start screen ---------- */
.paper{margin:16px 0 0;padding:12px 15px;border-radius:8px;background:var(--amber-bg);
   border:1px solid var(--amber-line);font-family:var(--ui);font-size:14.5px;
   line-height:1.5;color:#6b4e14}
.paper b{color:#5a400c}
.backlink{background:none;border:0;padding:0;font-family:var(--ui);font-size:14px;
   color:var(--accent);cursor:pointer;margin-top:18px}

/* ---------- highlighter ---------- */
mark.hl{background:#ffe6a0;color:inherit;border-radius:2px;padding:.5px 0;cursor:pointer;
  box-shadow:0 0 0 1px rgba(201,154,22,.3)}
mark.hl:hover{background:#ffd978}
[data-hl]{-webkit-user-select:text;user-select:text}
.hlbar{position:absolute;z-index:70}
.hlbar button{font-family:var(--ui);font-size:12.5px;font-weight:600;color:#fff;
  background:#1f2b3d;border:0;border-radius:7px;padding:7px 12px;cursor:pointer;
  box-shadow:0 5px 16px rgba(16,24,40,.3);white-space:nowrap}
.hlbar button:hover{background:#2d3d55}
.hlhint{font-family:var(--ui);font-size:12px;color:var(--ink-soft);margin:10px 0 0}

.phead{font-family:var(--serif);font-size:15.5px;font-weight:700;margin:20px 0 8px}
.pjazz{margin:0 0 15px}
.snum{color:var(--ink-faint);font-size:12.5px;font-weight:700}
</style>
</head>
<body>
<header class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="brand">SHSAT Practice <span id="secname"></span></div>
    <div class="count" id="count"></div>
  </div>
</header>
<div class="track" id="track" hidden><i id="trackbar" style="width:0%"></i></div>
<main id="app"></main>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-h">
  <div class="modal-card">
    <h3 id="modal-h">Are you sure?</h3>
    <p id="modal-p"></p>
    <div class="modal-btns">
      <button class="btn btn-ghost" id="modal-no">Cancel</button>
      <button class="btn btn-primary" id="modal-yes">Confirm</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

 "num", "stem": "<p>A rectangular box has a base with length 6 and width 4. The height of the box is twice its length.</p><p>What is the surface area of the box?</p>", "fig": null, "ans": "288", "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 32, "type": "num", "stem": "<p>In an inventory of 120 juices, 72 are organic and 45 are low-sugar. Of the organic juices, 30 are low-sugar.</p><p>If a juice in the inventory is selected at random, what is the probability that it is <b>neither</b> organic nor low-sugar? Enter your answer as a decimal or a fraction.</p>", "fig": null, "ans": "0.275", "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 33, "type": "num", "stem": "<p>What is the area of the shaded region shown?</p>", "fig": "shaded_grid", "ans": "12", "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 34, "type": "multi", "stem": "<p>If all possible values of <i>x</i> are indicated by the shaded part of the number line above, which of the following values could <b>not</b> be a possible value of <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\"><i>x</i></span></span>?</p><p>Select the <b>two</b> correct answer choices.</p>", "fig": "recip_numline", "figtop": true, "opts": ["&minus;2", "&minus;3", "&minus;1", "&minus;<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>", "&minus;<span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">3</span></span>", "&minus;<span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">3</span></span>"], "ais": [1, 3], "pick": 2, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 35, "type": "mc", "stem": "<p>The graph shows two lines, <i>&#8467;</i><sub>1</sub> and <i>&#8467;</i><sub>2</sub>.</p><p>Which line represents a <b>proportional</b> relationship between <i>x</i> and <i>y</i>, and why?</p>", "fig": "prop_lines", "opts": ["Only <i>&#8467;</i><sub> e": null, "grp": null, "text": null}, {"n": 43, "type": "mc", "stem": "<p>In Country X, there are 40,000 teachers. If 26,000 of the teachers teach mathematics and 22,000 of the teachers coach a sport, what is the <b>lowest possible</b> number of teachers who both teach mathematics and coach a sport?</p>", "fig": null, "opts": ["8,000", "14,000", "22,000", "26,000"], "ai": 0, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 44, "type": "mc", "stem": "<p>The ratio of pears to plums at a fruit stand is 7 to 3. The ratio of figs to plums is 4 to 9.</p><p>What is the ratio of pears to figs?</p>", "fig": null, "opts": ["4 : 21", "7 : 4", "21 : 4", "28 : 27"], "ai": 2, "fixed": true, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 45, "type": "mc", "stem": "<p>The Redfield Roadrunner Club is divided into three teams, A, B, and C. Each team was challenged to run around a track as many times as possible. The table shows each team&rsquo;s greatest number of loops run and the range of loops run within that team.</p><div class='tw'><div class='tt'>Loops Around the Track</div><table class='data'><tr><th></th><th>Most Loops Run</th><th>Range</th></tr><tr><td>Team A</td><td>82</td><td>16</td></tr><tr><td>Team B</td><td>85</td><td>23</td></tr><tr><td>Team C</td><td>88</td><td>15</td></tr></table></div><p>What is the overall range of loops run for all three teams?</p>", "fig": null, "opts": ["15", "16", "23", "26"], "ai": 3, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 46, "type": "mc", "stem": "<p>In a recent local election, between 55% and 65% of 1,400 registered voters cast a ballot.</p><p>What is the <b>minimum</b> number of registered voters who did <b>not</b> cast a ballot?</p>", "fig": null, "opts": ["490", "630", "770", "910"], "ai": 0, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 47, "type": "mc", "stem": "<p>Based on the number line shown, which of the following statements <b>must</b> be true?</p>", "fig": "numline_abc", "opts": ["<i>A</i> + <i>B</i> &gt; 0", "<i>A</i> + <i>C</i> &gt; 2", "<i>C</i> &minus; <i>B</i> &gt; 1", "<i>C</i> &minus; <i>A</i> &gt; 3"], "ai": 3, "fixed": true, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 48, "type": "mc", "stem": "<p>Points <i>A</i> and <i>G</i> on a number line are 24 units apart, and point <i>D</i> is the midpoint of <i>AG</i>. Point <i>X</i>, which is located at &minus;5 on the number line, is the midpoint of <i>AD</i>.</p><p>Which of the following is a <b>possible</b> midpoint of <i>XG</i>?</p>", "fig": null, "opts": ["&minus;2", "1", "4", "7"], "ai": 2, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 49, "type": "mc", "stem": "<p>In the figure shown, <i>x</i> =</p>", "fig": "angle_chase", "opts": ["32", "58", "122", "148"], "ai": 3, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 50, "type": "mc", "stem": "<p>Kai rides his bicycle up the hill to school and back every day. He travels three times as fast downhill as uphill, and it takes 40 minutes round-trip. If he travels at a rate of 24 miles per hour on the trip home, how far away is his school?</p>", "fig": null, "opts": ["4", "6", "8", "16"], "ai": 0, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}]}], "texts": {"lacocina": {"label": "The Food Business Incubator", "html": "<p class=\"pintro\">This excerpt comes from an NPR article about La Cocina, a nonprofit organization in San Francisco that helps aspiring food entrepreneurs develop their businesses.</p><h3 class=\"ptitle\">Excerpt from &ldquo;The Food Business Incubator&rdquo;</h3><div class=\"byline\">by Mandalit Del Barco</div><p class=\"ppara\"><span class=\"pnum\">1</span><span>&ldquo;La Cocina&rdquo; means &ldquo;the kitchen&rdquo; in Spanish. It&rsquo;s also the name of a business incubator<sup>1</sup> based in San Francisco&rsquo;s Mission District. Since it began in 2005, it&rsquo;s been helping local food entrepreneurs, many of whom are low-income immigrant women, develop their small businesses.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>Over the years, many of its alumni have found success: more than 50 chefs in its program have become self-sufficient business owners, and many of them have opened their own brick-and-mortar restaurants. Two alumnae of its culinary program . . . were even recognized as semi-finalists for prestigious James Beard awards.<sup>2</sup></span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>A new cookbook, <i>We Are La Cocina: Recipes in Pursuit of the American Dream</i>, tells some of their stories.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>Executive director Caleb Zigas says the nonprofit La Cocina grew out of two grassroots economic development organizations<sup>3</sup> who found many people cooking at their homes and selling food on the streets. The vendors needed an affordable commercial kitchen space and technical assistance in order for their businesses to be legally viable. La Cocina provided just such a space, in addition to helping them develop business plans, pull city permits and more.</span></p><p class=\"ppara\"><span class=\"pnum\">5</span><span>Zigas says as many as eight businesses can work in the kitchen space at La Cocina at any one time. Some can prep for a farmers&rsquo; market sale, corporate catering gigs or weddings, while others might be making and packaging their food products.</span></p><p class=\"ppara\"><span class=\"pnum\">6</span><span>&ldquo;It&rsquo;s just an incredible and exciting range of techniques, flavors, perspectives, age, language. And that&rsquo;s a really beautiful thing,&rdquo; he says. . . .</span></p><p class=\"ppara\"><span class=\"pnum\">7</span><span>Twice a year, La Cocina hosts &ldquo;F&amp;B: Voices from the Kitchen,&rdquo; a storytelling project where their chefs can tell their own stories, as they do in the new cookbook. Some of the chefs will be on tour to promote the book, whose proceeds will go to support La Cocina entrepreneurs.</span></p><p class=\"ppara\"><span class=\"pnum\">8</span><span>NPR<sup>4</sup> caught up with . . . La Cocina chefs, who shared their stories:</span></p><h4 class=\"phead\">Mariko Grady, Aedan Fermented Foods</h4><p class=\"ppara\"><span class=\"pnum\">9</span><span>At La Cocina, you can often hear Mariko Grady singing or humming as she prepares miso, <i>koji</i>, and <i>amasake</i>. Her fermented products come in four different flavors, including mushroom and chicken, to be used in soups and sauces. She originally brought the fermenting rice and barley <i>koji</i> seeds from Japan, where she had a 30-year career as a singer and dancer with the prestigious modern theatrical dance group she founded, Pappa Tarahumara. They performed around the world, and 16 years ago, had a one-night show in San Francisco. The man who would become her husband was in the audience. She soon joined him in San Francisco, often returning to Tokyo to rehearse. But after the earthquake and tsunami hit Japan in 2011, her company disbanded. . . . Grady focused on nourishing her family and creating a line of fermented products that she sells online, at local Bay Area stores and at the Ferry Plaza Farmers Market. She began at La Cocina in 2012 and named her business after her son, Aedan. (Written in Kanji characters, the name means &ldquo;wisdom&rdquo; and &ldquo;handed down from generation to generation.&rdquo;) . . . Her fermented products are &ldquo;also full of wisdom about how to relate to nature and how to create a healthy life,&rdquo; she says. . . .</span></p><h4 class=\"phead\">Shani Jones, Peaches Patties</h4><p class=\"ppara\"><span class=\"pnum\">10</span><span>Shani Jones is a native San Franciscan. Her father was born in New Orleans, her mother, in Jamaica. She says their home was always filled with a variety of spices and dishes like jerk chicken and Jamaican patties&mdash;savory pastries filled with beef or chicken. Jones says she learned to cook from her mother, whose nickname was Peaches. After returning from college in Atlanta, Jones worked on her doctorate in organizational leadership and management while driving a Lyft<sup>5</sup> car. She often told passengers about her idea of opening a catering company with her mom&rsquo;s recipes. They steered her to La Cocina, where she developed her own business, named after her mother. Five years later, she caters and runs a kiosk<sup>6</sup> at a small food cooperative in Bernal Heights, where some of her handmade patties have an Ethiopian twist, &ldquo;because my husband is Ethiopian.&rdquo; Jones has big aspirations for Peaches Patties: &ldquo;The ultimate goal,&rdquo; she says, &ldquo;is to be the patty kingpin<sup>7</sup> of the West Coast.&rdquo;</span></p><figure class=\"pfig\"><img alt=\"Table: Qualifications for La Cocina Applicants\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAN8BAMAAAB4sgo5AAAAGFBMVEX////+/v79/f3m5uahoaFdXV0uLi4QEBCJ+UCOAAEAAElEQVR42uz935ccx5UmCH7XIiHVtIhwM4+EdM42EGFunqD2nC1mRoYnyH5ZEUCC4tPulAip9brTVT16nOntkvqf2LPv29vqmX1dEVTNzDl7TonIBMiarmoSGZGRSUklkBnuHpEUQYoId/NISCAlhNk+uHtk5A9AoAhKAhD3ABkR7mbXrplfv3btmtlnwIxmNKMZzWhGM5rRjGY0oxnNaEYzmtGMZjSjGc1oRjOa0YxmNKMZzWhGM5rRjGY0oxnNaEYzmtGMZjSjGc1oRjOa0YxmNKMZzWhGM5rRjGY0oxnNaEYzmtGMZjSjGc1oRjOa0YxmNKMZzQgA6DGT1+WaJxpQJkbxlzyEAFweAiAPsBGTAGD7EjAxwIpPKCQaLs9ZGQYgBMiztM+HvESDvPwWkGcGTDxJx+T+zVIQAGr/GuByINE5bxsV94EQTAKJVjDxRPrifl6WjYrcNppIwWS4z2D/syjR5TYCXKcvcx42gkJe+ow+37shi9b+zJmYvN/tY+5KHFOMBMB4qWMPLJGVCudNeDN8NslLiY5kcaeu8uNfSDywvjPL9pAkdy/ArskYK6YDsNa9WBMt8zUAC401gFgT4OvsvAZgMw66F2u5ewG43QW8mh3HqOWPiAyzQBsMLY7bW5ZYE8OYWHOoM2pxpO28yEoTAGyH4SJwe8ui1tRAW+YGjbXuxbkNWbHDeCJmxYNdA5hZ4bi9bQCyKxx2DT4HxlsB7umYte51weg81m2pYHRedyyw4ADjbcMu5AX5cg0AAgDDuGQEIEAb4DVuNy330W0Wlm3TrnDYXvzn9/TmHitdY7uXPVj+Gsh/ZtMy8j/Vmlhge1rz2vIaQBQA1Wss0ADG75zXdJOPBpeWYVN3naz Emma Marris</div><p class=\"ppara\"><span class=\"pnum\">1</span><span>Invasive species are scary. It was ecologist Charles Elton, back in the 1950s, who introduced the militaristic &ldquo;invasion&rdquo; metaphor to describe exotic plants and animals&mdash;but there&rsquo;s no question some can be extremely destructive.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>The brown tree snake has eaten a dozen kinds of forest birds in Guam to extinction; zebra mussels clog pipes around the Great Lakes; the common house cat turns out to be, in Australia, a mercilessly effective killer of cute, fluffy marsupials like the bilby and the numbat.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>As scientists have sounded the alarm about these pests, the public has gotten the message. Citizen groups rip out non-native plants. Native gardens have become increasingly popular, both as ways to celebrate the unique flora of each region and as tiny hot spots of diversity. Native trees provide food for native bugs, which feed native birds. Food chains developed over thousands of years of co-evolution unfold in our backyards. . . .</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>So we&rsquo;ve learned, scientists and laypeople alike, that native species are good and non-natives are bad.</span></p><p class=\"ppara\"><span class=\"pnum\">5</span><span>Julian Olden, a biologist at the University of Washington, Seattle, who co-organized the symposium, recently polled nearly 2,000 ecologists. Among his findings: a substantial number of them said they would immediately eradicate a hypothetical non-native forest plant, even if it were shown to have no effect on the forest. Olden calls this the &ldquo;guilty even when proven innocent&rdquo; approach.</span></p><p class=\"ppara\"><span class=\"pnum\">6</span><span>That kind of approach is not very useful on a rapidly changing planet.</span></p><h4 class=\"phead\">Exotics Are Everywhere</h4><p class=\"ppara\"><span class=\"pnum\">7</span><span>Climate change is making it harder even to decide who the invaders are.</span></p><p class=\"ppara\"><span class=\"pnum\">8</span><span>How, scientists at the symposium wondered, do you define &ldquo;native&rdquo; on a warming planet, when plants and animals are already moving toward the poles or up mountainsides in search of climate conditions they can tolerate? Should we consider them &ldquo;invasive&rdquo; in their new homes? Regardless of what we label them, conservationists will be reluctant to remove them from their new environs&mdash;to do so would stymie<sup>1</sup> their chances of adapting to the warmer future we&rsquo;re creating.</span></p><p class=\"ppara\"><span class=\"pnum\">9</span><span>And then there are the non-natives that we actually like. Most domestic crops are exotic in most of the places they&rsquo;re grown, but there are even wild exotics that &ldquo;do good,&rdquo; forming useful relationships with native species.</span></p><p class=\"ppara\"><span class=\"pnum\">10</span><span>Edwin Grosholz of the University of California, Davis, told the recent symposium about one such relationship. On beaches in his state, non-native spartina grass has become important habitat for the endangered California clapper rail, a plump shorebird with a downward curving bill more at home on land than in the air. A project to rip out and poison the spartina&mdash;which grows in dense swaths that exclude many other shorebirds&mdash;saw clapper rail numbers go tumbling downward.</span></p><p class=\"ppara\"><span class=\"pnum\">11</span><span>There are other examples like that. The endangered southwestern willow flycatcher nests in &ldquo;invasive&rdquo; tamarisk shrubs. Many native (and beautiful) Hawaiian flowers are now pollinated by the Japanese white-eye bird&mdash;because the native pollinators have been driven extinct by other non-native species.</span></p><p class=\"ppara\"><span class=\"pnum\">12</span><span>Should we impose further risk on already endangered natives by severing these relationships? Or should we admire the resilience of nature and let such &ldquo;well-behaved&rdquo; exotics stay? . . .</span></p><p class=\"ppara\"><span class=\"pnum\">13</span><span>Leave them alone, more and more conservationists are arguing, and stop focusing obsessively on categorizing species as native or non-native. Mark Davis, an ecologist at Macalester College in St. Paul, Minnesota, once considered himself an &ldquo;invasion biologist&rdquo;&mdash;but not anymore. &ldquo;I am actively trying to get the field to retire the invader narrative,&rdquo; he said in Missoula.</span></p><h4 class=\"phead\">A Good Thing, Not the Only Thing</h4><p class=\"ppara\"><span class=\"pnum\">14</span><span>After all, nativeness is just one environmental value, and arguably not as important as preventing extinctions and preserving biodiversity. In some cases we can best serve biodiversity by leaving the non-natives alone or even&mdash;brace yourself, now&mdash;introducing them on purpose.</span></p><p class=\"ppara\"><span class=\"pnum\">15</span><span>This is the thinking behind, for example, installing the Aldabra tortoise on the islands of Mauritius. The islands lost their own large tortoises, and the fruiting plants that formerly had their seeds moved around by these fruit-loving reptiles have been on the decline. A tortoise that&rsquo;s related to the island&rsquo;s large tortoises&mdash;a non-native from the Seychelles in the Indian Ocean that was intentionally introduced in 2004&mdash;is now handling some of that work.</span></p><p class=\"ppara\"><span class=\"pnum\">16</span><span>Most of the time, for the time being, conserving species still means focusing on supporting them in their historical habitats, planting natives and removing non-natives. We can and should do that in places where it is feasible and important to us.</span></p><figure class=\"pfig\"><img alt=\"Chart: Possible Manag v class=\"pline\"><span class=\"lnum\">5</span><span style=\"padding-left:2.7em;text-indent:-1.1em\">I came from Fargo with a load of wheat up to the</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">danger line.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.7em;text-indent:-1.1em\">I came from Omaha with a load of shorthorns and</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">they splintered my boards.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:2.7em;text-indent:-1.1em\">I came from Detroit heavy with a load of flivvers.</span></div><div class=\"pline\"><span class=\"lnum\">10</span><span style=\"padding-left:2.7em;text-indent:-1.1em\">I carried apples from the Hood river last year and this</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">year bunches of bananas from Florida; they look for</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">me with watermelons from Mississippi next year.</span></div></div><div class=\"stanza\"><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">Hammers and shovels of work gangs sleep in shop</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">corners</span></div><div class=\"pline\"><span class=\"lnum\">15</span><span style=\"padding-left:1.1em;text-indent:-1.1em\">when the dark stars come on the sky and the night</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">watchmen walk and look.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">Then the hammer heads talk to the handles,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">then the scoops of the shovels talk,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">how the day&rsquo;s work nicked and trimmed them,</span></div><div class=\"pline\"><span class=\"lnum\">20</span><span style=\"padding-left:1.1em;text-indent:-1.1em\">how they swung and lifted all day,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">how the hands of the work gangs smelled of hope.</span></div></div><div class=\"stanza\"><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">In the night of the dark stars</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">when the curve of the sky is a work gang handle,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">in the night on the mile long sidetracks,</span></div><div class=\"pline\"><span class=\"lnum\">25</span><span style=\"padding-left:1.1em;text-indent:-1.1em\">in the night where the hammers and shovels sleep</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">in corners,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">the night watchmen stuff their pipes with dreams&mdash;</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">and sometimes they doze and don&rsquo;t care for nothin&rsquo;,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">and sometimes they search their heads for meanings,</span></div><div class=\"pline\"><span class=\"lnum\">30</span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">stories, stars.</span></div></div><div class=\"stanza\"><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">The stuff of it runs like this:</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">A long way we come; a long way to go; long rests and</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">long deep sniffs for our lungs on the way.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:1.1em;text-indent:-1.1em\">Sleep is a belonging of all; even if all songs are old</span></div><div class=\"pline\"><span class=\"lnum\">35</span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">songs and the singing heart is snuffed out like a</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">switchman&rsquo;s lantern with the oil gone, even if we</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">forget our names and houses in the finish, the secret</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">of sleep is left us, sleep belongs to all, sleep is the first</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">and last and best of all.</span></div></div><div class=\"stanza\"><div class=\"pline\"><span class=\"lnum\">40</span><span style=\"padding-left:1.1em;text-indent:-1.1em\">People singing; people with song mouths connecting</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">with song hearts; people who must sing or die; people</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">whose song hearts break if there is no song mouth;</span></div><div class=\"pline\"><span class=\"lnum\"></span><span style=\"padding-left:4.300000000000001em;text-indent:-1.1em\">these are my people.</span></div></div>"}, "alchemy": {"label": "Alchemy", "html": "<h3 class=\"ptitle\">Alchemy: The Ancient Science of Transmutation</h3><p class=\"ppara\"><span class=\"pnum\">1</span><span>Alchemy is the name given to the attempt to change lead, copper, or other metals into silver or gold. Today, alchemy is regarded as a pseudoscience because its associations with astrology and the occult suggest primitive superstition to the modern mind. If mentioned at all, the alchemist is generally portrayed as a charlatan obsessed with dreams of impossible wealth. For many centuries, however, alchemy was a highly respected art. Indeed, in the search for the elusive secret to making gold, alchemists helped to develop many of the apparatuses and procedures that are used in laboratories today, and the results of their experiments laid the basic conceptual framework for much of the modern science of chemistry.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>The philosophy underlying the practice of alchemy emerged in similar forms in ancient China, India, and Greece around the start of the Common Era. The alchemists believed that all matter consisted of various combinations of five elements&mdash;air, water, earth, fire, and space&mdash;and that there were correspondences among the elements, the planets, and metals. They regarded gold as the &ldquo;purest&rdquo; and &ldquo;noblest&rdquo; of all metals and believed that &ldquo;base&rdquo; metals such as copper and lead were only imperfectly developed forms of gold. The base metals were said to contain impurities that &ldquo;weighed down&rdquo; their perfect qualities. Thus, under certain astrological conditions, the alchemists believed that these metals could be purified through long heating or other treatments.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>Since they believed in the interrelationship between the natural world and the human world, this &ldquo;purification&rdquo; process had a profound significance for the alchemists. With purification, the alchemists believed, base metals attained a state of perfection, just as human souls attained a perfect state in heaven.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>In the twelfth century, translations of Arabic works on alchemy started to become available in Europe, generating a new wave of European interest in the art. In this period, alchemists made many important chemical discoveries, such as mineral acids and alcohol. As late as the seventeenth century, that supreme genius of rationalism, Sir Isaac Newton, devoted 30 years to the study of alchemy. By the early nineteenth century, practitioners of the new discipline of chemistry began to differentiate their research and experiments from those of alchemists, who were defined as those only searching to transmute other elements into gold. Although the possibility of making gold from other elements was conclusively disproved later in the nineteenth century, this belief provided the basis for some of the most fascinating chapters in the history of science and produced a legacy of imagery that persists in modern psychology and literature.</span></p>"}, "photo": {"label": "Life without Photosynthesis", "html": "<h3 class=\"ptitle\">Life without Photosynthesis</h3><p class=\"ppara\"><span class=\"pnum\">1</span><span>Most life is fundamentally dependent on photosynthetic organisms that store radiant energy from the Sun. In almost all the world&rsquo;s ecosystems and food chains, photosynthetic organisms such as plants and algae are eaten by other organisms, which are then consumed by still others. The existence of organisms that are not dependent on the Sun&rsquo;s light has long been established, but until recently they were regarded as anomalies. Over the past several decades, however, research in deep-sea areas has revealed the existence of entire ecosystems in which the primary producers of food are chemosynthetic bacteria, bacteria that are dependent on energy from within the earth itself. Indeed, growing evidence suggests that these ecosystems may model the way in which life first came about on this planet.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>The first of these unique chemosynthetic ecosystems was discovered in 1977 by a small research submarine investigating the Galapagos Rift, a volcanically active area 7,000 feet below the surface of the eastern Pacific Ocean. At a boundary between adjacent plates in the earth, scientists found a surprisingly congenial environment for life. They discovered that water was seeping down through cracks in the ocean floor, being heated by the volcanic rocks, and rising again to create an oasis of warmth in the near-freezing waters. Moreover, under conditions of extreme heat and pressure, chemical reactions were taking place that supplied sufficient energy for the chemosynthetic bacteria to develop. In this ecosystem and others discovered since, bacteria become the primary producers in the ecosystem by transforming chemicals into compounds that can serve as nourishment for more complex forms of life.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>What do these underwater worlds look like? More than a dozen of these warm-water oases have been discovered in the Pacific so far, and the specific life forms that arise in them vary according to whichever species first colonizes the site. The inhabitants of these deep-sea communities can include clams, mussels, crabs, and octopods, and, as the technology to research these inaccessible sites has only been available recently, over 300 new species have been discovered. The environment often produces sights that are spectacular to behold&mdash;clams measuring some 20 centimeters can cover the ocean floor. One oasis, ironically known as the Garden of Eden, is populated by huge tube worms that lack mouths and digestive tracts and obtain their energy instead from bacteria living in their tissues. The tube worms are able to reach an incredible size, sometimes over two meters tall, because their environment is so rich in nutrients.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>While organisms that do not rely on photosynthesis have long been regarded as mere anomalies, recent research shows that they can support entire communities of life. The deep sea is a vast frontier that is bound to reveal new species and further insight into chemosynthesis and the species that rely upon it. Researchers will continue to use new technologies to discover other species that operate within chemosynthetic ecosystems.</span></p>"}, "jazz": {"label": "Jazz Saxophone", "html": "<h3 class=\"ptitle\">Jazz Saxophone</h3><p class=\"pjazz\"><span class=\"snum\">(1)</span> Until last year, playing in our school&rsquo;s jazz band was not very popular. <span class=\"snum\">(2)</span> This was because only the guitar and drums were seen as being cool instruments. <span class=\"snum\">(3)</span> Rock and dance were the most popular kinds of music, but I play jazz on my saxophone.</p><p class=\"pjazz\"><span class=\"snum\">(4)</span> Last year, my music teacher told some of us in the jazz band that he could get us paid jobs. <span class=\"snum\">(5)</span> Those of us who were picked played our first job at a birthday party a week later. <span class=\"snum\">(6)</span> He chose a small group of us to play at local events and earn a little money.</p><p class=\"pjazz\"><span class=\"snum\">(7)</span> One evening, we were going to play for the whole school at an alumni reunion. <span class=\"snum\">(8)</span> I was very nervous. <span class=\"snum\">(9)</span> Lots of my classmates were going to be there. <span class=\"snum\">(10)</span> There would also be important people. <span class=\"snum\">(11)</span> Even one professional musician. <span class=\"snum\">(12)</span> He used to go to our school.</p><p class=\"pjazz\"><span class=\"snum\">(13)</span> I was playing well, so the music teacher told me to take a solo. <span class=\"snum\">(14)</span> Terrified, I thought my hands would slip off the keys from shaking so much. <span class=\"snum\">(15)</span> I played my very best, and afterward everybody said how much they liked it, even the professional. <span class=\"snum\">(16)</span> Jazz may not be as popular as rock or dance music, but playing in the jazz band can still be a positive experience. <span class=\"snum\">(17)</span> And it can make you popular, too.</p><p class=\"pjazz\"><span class=\"snum\">(18)</span> The principal liked our playing so much that he invited us to play next month at a school party to celebrate the retirement of one of the school&rsquo;s most popular teachers, Mrs. Callahan. <span class=\"snum\">(19)</span> Since she teaches French, we&rsquo;re learning a bunch of traditional French songs, like &ldquo;Fr&egrave;re Jacques&rdquo; and &ldquo;Sur le Pont d&rsquo;Avignon.&rdquo; <span class=\"snum\">(20)</span> These are really easy songs to play, so I think maybe I can make them more fun by playing them in a jazz style. <span class=\"snum\">(21)</span> I may also learn to play the trumpet. <span class=\"snum\">(22)</span> I don&rsquo;t know if our music teacher will let me play jazzy French songs, but I think Mrs. Callahan would like it. <span class=\"snum\">(23)</span> I would play the song the original way, then maybe do a jazz solo. <span class=\"snum\">(24)</span> If my music teacher lets me do this, I bet my friends will be impressed, and I&rsquo;ll get even more popular.</p>"}}, "textOrder": ["lacocina", "invasive", "workgangs", "alchemy", "photo", "jazz"], "figs": {"rect_triangle": "<div class=\"fig\"><svg viewBox=\"0 0 380 252\" width=\"380\" height=\"252\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"46\" y=\"22\" width=\"300\" height=\"210\" fill=\"none\" stroke=\"#1a2433\" stroke-width=\"1.7\"/><polygon points=\"46,22 346,22 160,232\" fill=\"#5d6b7e\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><text x=\"196\" y=\"13\" text-anchor=\"middle\" font-size=\"13\" >10</text><text x=\"360\" y=\"132\" text-anchor=\"start\" font-size=\"13\" >7</text></svg></div>", "segment_rst": "<div class=\"fig\"><svg viewBox=\"0 0 454 80\" width=\"454\" height=\"80\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"44\" y1=\"40\" x2=\"424\" y2=\"40\" stroke=\"#1a2433\" stroke-width=\"1.8\"/><circle cx=\"44\" cy=\"40\" r=\"4\" fill=\"#1a2433\"/><text x=\"44\" y=\"64\" text-anchor=\"middle\" font-size=\"14\" ><tspan font-style='italic'>R</tspan></text><circle cx=\"329\" cy=\"40\" r=\"4\" fill=\"#1a2433\"/><text x=\"329\" y=\"64\" text-anchor=\"middle\" font-size=\"14\" ><tspan font-style='italic'>S</tspan></text><circle cx=\"424\" cy=\"40\" r=\"4\" fill=\"#1a2433\"/><text x=\"424\" y=\"64\" text-anchor=\"middle\" font-size=\"14\" ><tspan font-style='italic'>T</tspan></text></svg></div>", "numline_ab": "<div class=\"fig\"><svg viewBox=\"0 0 440 86\" width=\"440\" height=\"86\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"44\" x2=\"422\" y2=\"44\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><path d=\"M 18 44 l 9 -4.5 l 0 9 z\" fill=\"#1 var STORE = "shsat_combined_v1";

var queue = [], idx = 0, answers = {}, pending = null, elapsed = 0;
var elim = {};      // elim[key] = "AC" : choices the student crossed out
var paneReset = false;   // true for one render when the passage pane should go to top
var clickY = null;       // page scroll as it was BEFORE the browser focused a button

// A click focuses the button, and the browser scrolls that button into view before
// any click handler runs. Snapshot the real position on mousedown, which fires first.
document.addEventListener("mousedown", function(){
  clickY = window.pageYOffset || document.documentElement.scrollTop || 0;
}, true);
document.addEventListener("touchstart", function(){
  clickY = window.pageYOffset || document.documentElement.scrollTop || 0;
}, true);
var held = null;    // token picked up on a drag-table item
var plan = null;    // "full" or "one"
var startWith = null;
var mode = "start", ticker = null, viewText = null, secStart = 0;

var app = document.getElementById("app");
var bar = document.getElementById("bar");
var track = document.getElementById("track");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function fmt(sec){
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h+":"+(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function key(it){ return it.sec + "-" + it.n; }
// A "set" is a run of consecutive items sharing a grp (one passage's
// questions).  Items without a grp are their own set -> forward-only.
function grpKey(it){ return it.sec + "/" + (it.grp ? it.grp : "@" + it.n); }
function setBounds(i){
  var g=grpKey(queue[i]), a=i, b=i;
  while (a>0 && grpKey(queue[a-1])===g) a--;
  while (b<queue.length-1 && grpKey(queue[b+1])===g) b++;
  return [a,b];
}
function setBlanks(a,b){
  var c=0;
  for (var i=a;i<=b;i++){
    var v = (i===idx ? pending : answers[key(queue[i])]);
    if (!v) c++;
  }
  return c;
}
function norm(v){
  return String(v == null ? "" : v).trim()
    .replace(/&minus;/g,"-").replace(/\u2212/g,"-").replace(/[$,%\s]/g,"");
}
function same(a, b){
  var x = norm(a), y = norm(b);
  if (!x) return false;
  if (x === y) return true;
  var fx = parseFloat(x), fy = parseFloat(y);
  return !isNaN(fx) && !isNaN(fy) && Math.abs(fx - fy) < 1e-9;
}

/* ------------------------------------------------------------ answer helpers */
function blankFor(it){
  if (it.type === "rowtable") return new Array(it.rows.length + 1).join("-");
  if (it.type === "dropdown") return new Array(it.parts.length + 1).join("-");
  if (it.type === "dragtable"){
    var a = []; for (var i = 0; i < it.correct.length; i++) a.push("");
    return a.join("|");
  }
  return "";
}
function parts(a, it){
  var s = (a == null || a === "") ? blankFor(it) : String(a);
  return it.type === "dragtable" ? s.split("|") : s.split("");
}
function letters(it){ return (it.n % 2 || it.sec === "math") ? "ABCDE" : "EFGHI"; }
function normExpr(v){
  return String(v == null ? "" : v)
    .replace(/≤/g,"<=").replace(/≥/g,">=")
    .replace(/−|–|—/g,"-")
    .replace(/×|·|∙/g,"*").replace(/÷/g,"/")
    .replace(/\s+/g,"").toLowerCase();
}
function checkAnswer(it, a){
  if (a == null || a === "") return false;
  var L = letters(it);
  switch (it.type){
    case "multi": {
      var want = it.ais.map(function(i){ return L.charAt(i); }).sort().join("");
      return String(a).split("").sort().join("") === want;
    }
    case "rowtable":  return String(a) === it.correct.join("");
    case "dropdown":  return String(a) === it.parts.map(function(p){return String(p[2]);}).join("");
    case "dragtable": return String(a) === it.correct.join("|");
    case "expr": {
      var got = normExpr(a);
      for (var i = 0; i < it.ans.length; i++){ if (normExpr(it.ans[i]) === got) return true; }
      return false;
    }
    case "num": {
      var x = parseFloat(norm(a)), y = parseFloat(norm(it.ans));
      if (isNaN(x) || isNaN(y)) return norm(a) === norm(it.ans);
      return Math.abs(x - y) <= (it.tol || 1e-9);
    }
    default: return String(a) === L.charAt(it.ai);
  }
}
function stripTags(s){
  return String(s).replace(/<[^>]+>/g,"").replace(/&minus;/g,"−")
                  .replace(/&nbsp;/g," ").replace(/&amp;/g,"&");
}
function keyText(it){
  var L = letters(it);
  switch (it.type){
    case "multi":     return it.ais.map(function(i){ return L.charAt(i); }).join(", ");
    case "rowtable":  return it.correct.map(function(c){ return it.cols[c]; }).join(" / ");
    case "dropdown":  return it.parts.map(function(p){ return stripTags(p[1][p[2]]); }).join(" / ");
    case "dragtable": return it.correct.join(", ");
    case "expr":      return it.ans[0];
    case "num":       return it.ans;
    default:          return L.charAt(it.ai);
  }
}
function youText(it, a){
  if (a == null || a === "" || a === blankFor(it)) return "";
  switch (it.type){
    case "rowtable":
      return parts(a,it).map(function(c){ return c==="-"?"—":it.cols[+c]; }).join(" / ");
    case "dropdown":
      return parts(a,it).map(function(c,i){
        return c==="-"?"—":stripTags(it.parts[i][1][+c]); }).join(" / ");
    case "dragtable":
      return parts(a,it).map(function(t){ return t===""?"—":t; }).join(", ");
    case "multi": return String(a).split("").sort().join(", ");
    default:      return String(a);
  }
}
function hasAnswer(it, a){
  if (a == null || a === "") return false;
  if (it.type === "rowtable" || it.type === "dropdown") return String(a).indexOf("-") === -1;
  if (it.type === "dragtable") return parts(a,it).every(function(t){ return t !== ""; });
  return !!norm(a);
}

function answered(){
  var c=0;
  queue.forEach(function(it){ if (hasAnswer(it, answers[key(it)])) c++; });
  return c;
}

function ask(head, msg, yesLabel, onYes){
  var m=document.getElementById("modal");
  document.getElementById("modal-h").textContent=head;
  document.getElementById("modal-p").textContent=msg;
  var yes=document.getElementById("modal-yes"), no=document.getElementById("modal-no");
  yes.textContent=yesLabel; m.hidden=false; yes.focus();
  function close(){ m.hidden=true; yes.onclick=null; no.onclick=null; }
  yes.onclick=function(){ close(); onYes(); };
  no.onclick=close;
}

function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(
    {idx:idx, answers:answers, elim:elim, hl:HL, elapsed:elapsed, mode:mode,
     secs:queue.length?uniqSecs():null})); }catch(e){}
}
function uniqSecs(){
  var out=[]; queue.forEach(function(i){ if(out.indexOf(i.sec)<0) out.push(i.sec); }); return out;
}
function wipe(){ try{ localStorage.removeItem(STORE); }catch(e){} }
function tick(){ elapsed++; if (elapsed % 15 === 0) save(); }
function startTicker(){ if(ticker) clearInterval(ticker); ticker=setInterval(tick,1000); }
function stopTicker(){ if(ticker){ clearInterval(ticker); ticker=null; } }

function secOf(k){
  for (var i=0;i<DATA.sections.length;i++) if (DATA.sections[i].key===k) return DATA.sections[i];
  return null;
}

/* ---------- text lock state ---------- */
function lastIdxOfText(tk){
  var last=-1;
  for (var i=0;i<queue.length;i++) if (queue[i].text===tk) last=i;
  return last;
}
function textState(tk){
  var li=lastIdxOfText(tk);
  if (li<0) return "none";
  if (idx>li) return "done";
  var cur=queue[idx];
  if (cur && cur.text===tk) return "current";
  return "future";
}

function paintChrome(){
  var showing = (mode==="test");
  bar.hidden=!showing; track.hidden=!showing;
  if(!showing) return;
  var it=queue[idx];
  document.getElementById("secname").textContent = "· " + secOf(it.sec).label;
  var secItems=queue.filter(function(q){return q.sec===it.sec;});
  var done=secItems.filter(function(q){return !!answers[key(q)];}).length;
  document.getElementById("count").textContent = done+" of "+secItems.length+" answered";
  document.getElementById("trackbar").style.width = ((idx/queue.length)*100)+"%";
}

function screenSecIntro(){
  var it=queue[idx], s=secOf(it.sec);
  var n=queue.filter(function(q){return q.sec===it.sec;}).length;
  var first = (idx === 0);
  var body = it.sec==="ela"
    ? '<p class="lede">Reading Comprehension comes first: six texts, each shown in a panel '+
      'beside its questions. Within one text&rsquo;s questions you may move back and forth; '+
      'submitting the last question of a set closes that set and its text. Revising and '+
      'Editing follows. You can highlight any text in a passage, a question or an answer '+
      'choice by selecting it.</p>'
    : '<p class="lede">Solve each problem and choose the best answer. Twelve questions are '+
