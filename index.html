      'write an expression, use drop-downs, pick one answer in each row, or place answers '+
      'into a table. The questions get harder as the section goes on. You can highlight any '+
      'text in a question or an answer choice by selecting it.</p>';
  if (!first) body = '<p class="lede"><b>Your first section is complete.</b> It has been '+
      'recorded, and this second section begins now. You will be scored on both together at '+
      'the end.</p>' + body;
  return '<div class="wrap"><div class="card">'+
    '<div class="eyebrow"><span class="qnum">Section</span></div>'+
    '<h1>'+s.label+'</h1>'+ body +
    '<div class="stats"><div class="stat"><div class="k">Questions</div>'+
      '<div class="v">'+n+'</div></div></div>'+
    '<div class="actions"><div class="note">Keep recording each answer on paper as you '+
      'go.</div><div class="btns">'+
      '<button class="btn btn-primary" id="gosec">Start section</button></div></div>'+
  '</div></div>';
}

function choiceRows(it){
  var rows="";
  for (var i=0;i<it.choices.length;i++){
    var c=it.choices[i];
    rows+='<button class="choice'+(pending===c.l?" on":"")+'" data-letter="'+c.l+'" '+
          'type="button"><span class="ltr">'+c.l+'</span><span class="ct">'+c.h+'</span></button>';
  }
  return '<div class="choices" role="group" aria-label="Answer choices">'+rows+'</div>';
}

function gridBox(){
  return '<div class="grid-in">'+
    '<label for="gridbox">Your answer</label>'+
    '<input id="gridbox" type="text" inputmode="text" autocomplete="off" spellcheck="false" '+
      'value="'+(pending==null?"":String(pending).replace(/"/g,"&quot;"))+'">'+
    '<div class="hint">Numbers only. Use a minus sign for a negative answer and a decimal '+
      'point if needed.</div></div>';
}


/* ------------------------------------------------------- item bodies by type */
function strikeBtn(L, on){
  return '<button class="elim" data-elim="'+L+'" type="button" tabindex="-1" '+
         'aria-label="'+(on?"Restore":"Cross out")+' choice '+L+'" '+
         'title="'+(on?"Restore this choice":"Cross this choice out")+'">'+
         (on?"&#8630;":"&times;")+'</button>';
}
function bodyMC(it){
  var L=letters(it), out="", struck=elim[key(it)]||"";
  for (var i=0;i<it.opts.length;i++){
    var c=L.charAt(i), off=struck.indexOf(c)>-1;
    out+='<div class="crow'+(pending===c?" on":"")+(off?" struck":"")+'">'+
      '<button class="pickwrap" data-letter="'+c+'" type="button">'+
      '<span class="ltr">'+c+'</span><span class="ct" data-hl="c:'+key(it)+':'+c+'">'+
      it.opts[i]+'</span></button>'+
      strikeBtn(c,off)+'</div>';
  }
  return '<div class="choices" role="group" aria-label="Answer choices">'+out+'</div>'+
    '<p class="elimhint">Use &times; to cross out a choice you have ruled out. Crossing out '+
    'never submits an answer.</p>'+
    '<p class="hlhint">Select any text above to highlight it. Click a highlight to remove '+
    'it.</p>';
}
function bodyMulti(it){
  var L=letters(it), chosen=pending?String(pending).split(""):[], out="";
  var struck=elim[key(it)]||"";
  for (var i=0;i<it.opts.length;i++){
    var c=L.charAt(i), on=chosen.indexOf(c)>-1, off=struck.indexOf(c)>-1;
    out+='<div class="crow'+(on?" on":"")+(off?" struck":"")+'">'+
      '<button class="pickwrap" data-check="'+c+'" type="button">'+
      '<span class="box">'+(on?"&#10003;":"")+'</span>'+
      '<span class="ltr">'+c+'</span><span class="ct" data-hl="c:'+key(it)+':'+c+'">'+
      it.opts[i]+'</span></button>'+
      strikeBtn(c,off)+'</div>';
  }
  var full=chosen.length===it.pick;
  return '<div class="choices" role="group" aria-label="Answer choices">'+out+'</div>'+
    '<p class="pickmsg'+(full?" full":"")+'">'+
    (full?"All "+it.pick+" selected.":chosen.length+" of "+it.pick+" selected.")+'</p>'+
    '<p class="elimhint">Use &times; to cross out a choice you have ruled out.</p>';
}
var PAL=["1","2","3","4","5","6","7","8","9","0","+","-","*","/","(",")",
         "<",">","≤","≥","=",".","x","π"];
function bodyExpr(it){
  var keys="";
  for (var i=0;i<PAL.length;i++) keys+='<button type="button" data-key="'+PAL[i]+'">'+PAL[i]+'</button>';
  keys+='<button type="button" class="util" data-key="BSP">&#9003;</button>'+
        '<button type="button" class="util" data-key="CLR">clear</button>';
  return '<div class="grid-in"><label for="exprbox">Your answer</label>'+
    '<input id="exprbox" class="exprbox" type="text" autocomplete="off" spellcheck="false" '+
    'value="'+(pending==null?"":String(pending).replace(/"/g,"&quot;"))+'">'+
    '<div class="pal">'+keys+'</div>'+
    '<div class="hint">Type your answer or use the buttons. Write a fraction with a '+
    'slash (3/4) and a product with * (0.2*3), and you may combine them in one '+
    'expression. Spaces do not matter.</div></div>';
}
function bodyRowTable(it){
  var sel=parts(pending,it), head='<th></th>';
  for (var c=0;c<it.cols.length;c++) head+='<th>'+it.cols[c]+'</th>';
  var rows="";
  for (var r=0;r<it.rows.length;r++){
    var cells='<td class="lab">'+it.rows[r]+'</td>';
    for (var c2=0;c2<it.cols.length;c2++){
      cells+='<td><button class="rdo'+(sel[r]===String(c2)?" on":"")+'" data-rt="'+r+","+c2+
             '" type="button" aria-label="'+it.cols[c2]+', row '+(r+1)+'"></button></td>';
    }
    rows+='<tr>'+cells+'</tr>';
  }
  return '<table class="rt"><tr>'+head+'</tr>'+rows+'</table>';
}
function bodyDropdown(it){
  var sel=parts(pending,it), out="";
  for (var i=0;i<it.parts.length;i++){
    var p=it.parts[i], opts='<option value="-">Choose&hellip;</option>';
    for (var j=0;j<p[1].length;j++){
      opts+='<option value="'+j+'"'+(sel[i]===String(j)?" selected":"")+'>'+
            stripTags(p[1][j])+'</option>';
    }
    out+='<div class="ddline">'+p[0]+'<select data-dd="'+i+'">'+opts+'</select>'+p[3]+'</div>';
  }
  return out;
}
function bodyDragTable(it){
  var placed=parts(pending,it), used={}, k=0;
  for (var i=0;i<placed.length;i++){ if (placed[i]) used[placed[i]]=true; }
  var tray="";
  for (var t=0;t<it.tokens.length;t++){
    var tk=it.tokens[t];
    tray+='<button class="tok'+(used[tk]?" used":"")+(held===tk?" held":"")+'" data-tok="'+
          tk+'" type="button"'+(used[tk]?" disabled":"")+'>'+tk+'</button>';
  }
  var head="";
  for (var c=0;c<it.head.length;c++) head+='<th>'+it.head[c]+'</th>';
  var rows="";
  for (var r=0;r<it.body.length;r++){
    var cells="";
    for (var c2=0;c2<it.body[r].length;c2++){
      var v=it.body[r][c2];
      if (v===null){
        cells+='<td><button class="dropcell'+(placed[k]?" filled":"")+
               (held&&!placed[k]?" target":"")+'" data-slot="'+k+'" type="button">'+
               (placed[k]||"")+'</button></td>';
        k++;
      } else cells+='<td>'+v+'</td>';
    }
    rows+='<tr>'+cells+'</tr>';
  }
  return '<div class="tray">'+tray+'</div>'+
    '<table class="rt"><tr>'+head+'</tr>'+rows+'</table>'+
    '<p class="elimhint">Tap an answer, then tap a box to place it. Tap a filled box to take '+
    'the answer back.</p>';
}
function itemBody(it){
  switch (it.type){
    case "multi":     return bodyMulti(it);
    case "num":       return gridBox();
    case "expr":      return bodyExpr(it);
    case "rowtable":  return bodyRowTable(it);
    case "dropdown":  return bodyDropdown(it);
    case "dragtable": return bodyDragTable(it);
    default:          return bodyMC(it);
  }
}
var BADGE={num:"Enter your answer",
           expr:"Write an expression", rowtable:"One per row",
           dropdown:"Drop-downs", dragtable:"Place the answers"};
var PICKWORD={2:"two", 3:"three", 4:"four"};
function badgeFor(it){
  if (it.type === "multi")
    return "Select " + (PICKWORD[it.pick] || it.pick || "more than one");
  return BADGE[it.type] || "";
}

function questionCard(it, isLast){
  var secItems=queue.filter(function(q){return q.sec===it.sec;});
  var pos=secItems.indexOf(it)+1;
  var bd=setBounds(idx), a=bd[0], b=bd[1];
  var inSet=(b>a), atSetEnd=(idx===b), canBack=(idx>a);

  var note;
  if (isLast)            note='Last question. The check mark submits your test.';
  else if (!inSet)       note='Once you move on, this question closes.';
  else if (atSetEnd)     note='Last question in this set. Submitting closes all '+
                              (b-a+1)+' and moves you on.';
  else                   note='You can move back and forth within this set until you '+
                              'submit the last question.';

  var fwdFinish = isLast || (inSet && atSetEnd);
  var fwdLabel  = isLast ? 'Finish test'
                         : (inSet && atSetEnd ? 'Submit this set' : 'Next question');

  return '<div class="eyebrow">'+
      '<span class="qnum">Question '+pos+' of '+secItems.length+'</span>'+
      (inSet ? '<span class="setpos">'+(idx-a+1)+' of '+(b-a+1)+' in this set</span>' : '')+
      (badgeFor(it) ? '<span class="badge">'+badgeFor(it)+'</span>' : '')+
    '</div>'+
    '<div class="stem" data-hl="s:'+key(it)+'">'+
      (it.lead ? '<p>'+it.lead+'</p>' : '')+
      (it.quote ? '<blockquote>'+it.quote+'</blockquote>' : '')+
      (it.fig && it.figtop ? '<div class="qfig">'+DATA.figs[it.fig]+'</div>' : '')+
      '<p>'+it.stem+'</p>'+
      (it.fig && !it.figtop ? '<div class="qfig">'+DATA.figs[it.fig]+'</div>' : '')+
    '</div>'+
    itemBody(it)+
    '<div class="actions"><div class="note">'+note+'</div>'+
    '<div class="btns">'+
      (canBack ? '<button class="arrow back" id="prev" aria-label="Previous question" '+
                 'title="Previous question">&larr;</button>' : '')+
      '<button class="arrow'+(fwdFinish?" finish":"")+'" id="next" '+
      'aria-label="'+fwdLabel+'" title="'+fwdLabel+'">'+
      (isLast?"&#10003;":"&rarr;")+'</button>'+
    '</div></div>';
}

function passagePane(){
  var cur=queue[idx];
  var tabs="";
  DATA.textOrder.forEach(function(tk){
    var st=textState(tk);
    if (st==="none") return;
    var on = (viewText===tk);
    tabs+='<button class="ptab'+(on?" on":"")+(st==="done"?" done":"")+'" '+
          'data-tab="'+tk+'"'+(st==="done"?' aria-disabled="true"':'')+'>'+
          (st==="done"?'<span class="lk">&#128274;</span>':'')+
          DATA.texts[tk].label+'</button>';
  });
  var notice="";
  if (viewText && cur.text && viewText!==cur.text){
    notice='<div class="pnotice"><span>You are previewing another text. '+
      'The current question is about &ldquo;'+DATA.texts[cur.text].label+'&rdquo;.</span>'+
      '<button id="backcur">Back to current text</button></div>';
  }
  var html = viewText ? DATA.texts[viewText].html : '';
  return '<section class="pane passage"><div class="ptabs">'+tabs+'</div>'+
         '<div class="pbody" id="pbody">'+notice+
         '<div data-hl="t:'+viewText+'">'+html+'</div></div></section>';
}

function screenTest(){
  var it=queue[idx], isLast=(idx===queue.length-1);
  if (it.text){
    return '<div class="wrap wide"><div class="split">'+
      passagePane()+
      '<section class="pane qs">'+questionCard(it,isLast)+'</section>'+
    '</div></div>';
  }
  return '<div class="wrap"><div class="card">'+questionCard(it,isLast)+'</div></div>';
}

/* ---------- results ---------- */
function scored(){
  var out={total:{right:0,n:0}, secs:{}, rows:{}, missed:{}};
  queue.forEach(function(it){
    var s=it.sec;
    out.secs[s]=out.secs[s]||{right:0,n:0,blank:0};
    out.rows[s]=out.rows[s]||"";
    out.missed[s]=out.missed[s]||[];
    var a=answers[key(it)], ok=checkAnswer(it, a), has=hasAnswer(it, a);
    out.secs[s].n++; out.total.n++;
    if(!has) out.secs[s].blank++;
    if(ok){ out.secs[s].right++; out.total.right++; } else out.missed[s].push(it.n);
    var secItems=queue.filter(function(q){return q.sec===s;});
    var pos=secItems.indexOf(it)+1;
    out.rows[s]+='<tr><td class="q">'+pos+'</td>'+
      '<td class="'+(has?(ok?"right":"wrong"):"blank")+'">'+
        (has?youText(it,a):"&mdash;")+'</td>'+
      '<td>'+keyText(it)+
        ((it.type==="mc" && (elim[key(it)]||"").indexOf(letters(it).charAt(it.ai))>-1)
          ? ' <span class="wrong" title="You crossed out the correct answer">&times;</span>'
          : '')+'</td>'+
      '<td>'+(ok?'<span class="right">correct</span>'
                :'<span class="wrong">'+(has?"incorrect":"blank")+'</span>')+'</td></tr>';
  });
  return out;
}

function resultsText(){
  var s=scored();
  var name=(document.getElementById("student")||{}).value||"(no name)";
  var L=[];
  L.push("SHSAT Practice - English Language Arts and Mathematics");
  L.push("Student: "+name);
  L.push("Date: "+new Date().toLocaleDateString());
  L.push("Time: "+fmt(elapsed));
  L.push("");
  uniqSecs().forEach(function(k){
    var d=s.secs[k];
    L.push(secOf(k).label.toUpperCase()+": "+d.right+" / "+d.n+
           "  ("+Math.round(d.right/d.n*100)+"%)   blank: "+d.blank);
    L.push("  missed: "+(s.missed[k].length?s.missed[k].join(", "):"none"));
    L.push("");
  });
  if (uniqSecs().length>1)
    L.push("OVERALL: "+s.total.right+" / "+s.total.n+
           "  ("+Math.round(s.total.right/s.total.n*100)+"%)");
  L.push("");
  uniqSecs().forEach(function(k){
    L.push("--- "+secOf(k).label+" ---");
    L.push("Q    Yours   Key");
    var secItems=queue.filter(function(q){return q.sec===k;});
    secItems.forEach(function(it,i){
      var a=answers[key(it)]||"-";
      var pad=function(v,n){ v=String(v); while(v.length<n) v+=" "; return v; };
      L.push(pad(i+1,5)+pad(a,8)+pad(it.answer,6)+(same(a,it.answer)?"correct":"INCORRECT"));
    });
    L.push("");
  });
  return L.join("\n");
}

function copyResults(){
  var txt=resultsText();
  var done=function(){ var n=document.getElementById("mailnote");
    if(n) n.textContent="Results copied. Paste them wherever you keep them."; };
  function fallback(){
    try{
      var ta=document.createElement("textarea");
      ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }catch(e){
      var n=document.getElementById("mailnote");
      if(n) n.textContent="Copying was blocked here. Download this file and open it in your "+
          "browser, then try again.";
    }
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(done, fallback);
    else fallback();
  }catch(e){ fallback(); }
}
function printSheet(){
  var name=(document.getElementById("student")||{}).value||"";
  var slot=document.getElementById("phname");
  if(slot) slot.textContent = name ? name : "—";
  try{ window.print(); }catch(e){}
}

function screenResults(){
  var s=scored(), secs=uniqSecs();
  var d=new Date();
  var head='<div class="printhead"><div class="ph-title">SHSAT Practice &mdash; ELA &amp; Mathematics</div>'+
    '<div class="ph-meta">Score report &nbsp;&middot;&nbsp; Name: <span id="phname">&mdash;'+
    '</span> &nbsp;&middot;&nbsp; '+d.toLocaleDateString()+'</div></div>';
  var stats='<div class="stats">';
  secs.forEach(function(k){
    var v=s.secs[k];
    stats+='<div class="stat"><div class="k">'+secOf(k).label+'</div><div class="v">'+
      v.right+' / '+v.n+'</div></div>';
  });
  if (secs.length>1)
    stats+='<div class="stat"><div class="k">Overall</div><div class="v">'+
      s.total.right+' / '+s.total.n+'</div></div>';
  stats+='<div class="stat"><div class="k">Total time</div><div class="v">'+fmt(elapsed)+
    '</div></div></div>';
  var body="";
  secs.forEach(function(k){
    body+='<h2>'+secOf(k).label+' &mdash; questions missed</h2>'+
      '<p class="missed">'+(s.missed[k].length?s.missed[k].join(', ')
        :'None &mdash; a perfect section.')+'</p>'+
      '<h2>'+secOf(k).label+' &mdash; question by question</h2>'+
      '<table class="sheet"><thead><tr><th>Q</th><th>Yours</th><th>Key</th><th>Result</th>'+
      '</tr></thead><tbody>'+s.rows[k]+'</tbody></table>';
  });
  return '<div class="wrap"><div class="card">'+ head +
    '<h1 class="noprint">Test complete</h1>'+
    '<p class="lede noprint">Your test has been scored. Add a name below if you want it on '+
      'to send or print the report.</p>'+
    '<div class="namefield noprint"><label for="student">Student name</label>'+
      '<input id="student" type="text" autocomplete="off" placeholder="Optional"></div>'+

    stats + body +
    '<div class="actions noprint"><div class="note" id="mailnote">Copy the results to '+
      'paste them somewhere, or save the whole report as a PDF.</div>'+
    '<div class="btns">'+
      '<button class="btn btn-ghost" id="restart">Start over</button>'+
      '<button class="btn btn-ghost" id="copy">Copy results</button>'+
      '<button class="btn btn-ghost" id="print">Save as PDF</button>'+

    '</div></div>'+
  '</div></div>';
}

/* ---------- render ---------- */
function render(){
  // remember where the reader was before the DOM is thrown away
  var pageY = (clickY != null) ? clickY
            : (window.pageYOffset || document.documentElement.scrollTop || 0);
  clickY = null;
  var pane  = document.getElementById("pbody");
  var paneY = pane ? pane.scrollTop : 0;

  if (mode==="start")        app.innerHTML=screenStart();
  else if (mode==="secintro")app.innerHTML=screenSecIntro();
  else if (mode==="test")    app.innerHTML=screenTest();
  else                       app.innerHTML=screenResults();
  paintChrome(); wire(); hlPaintAll(); hlHideBar();

  if (mode!=="test"){ window.scrollTo(0,0); return; }
  // selecting or crossing out an answer re-renders in place: put the view back
  window.scrollTo(0, pageY);
  var pane2 = document.getElementById("pbody");
  if (pane2 && !paneReset) pane2.scrollTop = paneY;
  paneReset = false;
}

function wire(){
  var $=function(i){ return document.getElementById(i); };

  var pl=app.querySelectorAll("[data-plan]");
  for (var i=0;i<pl.length;i++){
    pl[i].onclick=function(){ plan=this.getAttribute("data-plan"); render(); };
  }
  var od=app.querySelectorAll("[data-order]");
  for (var o=0;o<od.length;o++){
    od[o].onclick=function(){ begin(this.getAttribute("data-order").split(",")); };
  }
  var bk=$("back");
  if (bk) bk.onclick=function(){ plan=null; render(); };
  var go=$("gosec");
  if (go) go.onclick=function(){ mode="test"; syncView(); render(); };

  var cs=app.querySelectorAll("[data-letter]");
  for (var j=0;j<cs.length;j++){
    cs[j].onclick=function(){ pending=this.getAttribute("data-letter"); render(); };
  }
  var ms=app.querySelectorAll("[data-check]");
  for (var m=0;m<ms.length;m++){
    ms[m].onclick=function(){
      var it=queue[idx], L=this.getAttribute("data-check");
      var cur=pending?String(pending).split(""):[], at=cur.indexOf(L);
      if (at>-1) cur.splice(at,1); else if (cur.length<it.pick) cur.push(L);
      pending=cur.sort().join(""); render();
    };
  }
  var xs=app.querySelectorAll("[data-elim]");
  for (var e=0;e<xs.length;e++){
    xs[e].onclick=function(ev){
      ev.stopPropagation();
      var it=queue[idx], L=this.getAttribute("data-elim"), k2=key(it);
      var cur=elim[k2]||"", at=cur.indexOf(L);
      elim[k2]= at>-1 ? cur.slice(0,at)+cur.slice(at+1) : cur+L;
      save(); render();
    };
  }
  var rts=app.querySelectorAll("[data-rt]");
  for (var r=0;r<rts.length;r++){
    rts[r].onclick=function(){
      var it=queue[idx], rc=this.getAttribute("data-rt").split(",");
      var cur=parts(pending,it); cur[+rc[0]]=rc[1];
      pending=cur.join(""); render();
    };
  }
  var dds=app.querySelectorAll("[data-dd]");
  for (var d=0;d<dds.length;d++){
    dds[d].onchange=function(){
      var it=queue[idx], cur=parts(pending,it);
      cur[+this.getAttribute("data-dd")]=this.value;
      pending=cur.join(""); save();
    };
  }
  var toks=app.querySelectorAll("[data-tok]");
  for (var t=0;t<toks.length;t++){
    toks[t].onclick=function(){
      var tk=this.getAttribute("data-tok");
      held=(held===tk)?null:tk; render();
    };
  }
  var slots=app.querySelectorAll("[data-slot]");
  for (var s2=0;s2<slots.length;s2++){
    slots[s2].onclick=function(){
      var it=queue[idx], i=+this.getAttribute("data-slot"), cur=parts(pending,it);
      if (cur[i]){ held=null; cur[i]=""; }
      else if (held){ cur[i]=held; held=null; }
      pending=cur.join("|"); render();
    };
  }
  var ex=$("exprbox");
  if (ex){
    ex.oninput=function(){ pending=this.value; };
    ex.onkeydown=function(ev){ if (ev.key==="Enter"){ ev.preventDefault(); advance(); } };
    var pk=app.querySelectorAll("[data-key]");
    for (var k3=0;k3<pk.length;k3++){
      pk[k3].onclick=function(){
        var v=this.getAttribute("data-key"), box=$("exprbox");
        if (v==="CLR") box.value="";
        else if (v==="BSP") box.value=box.value.slice(0,-1);
        else {
          var a=box.selectionStart, b=box.selectionEnd;
          box.value=box.value.slice(0,a)+v+box.value.slice(b);
          box.setSelectionRange(a+v.length,a+v.length);
        }
        pending=box.value; box.focus();
      };
    }
    ex.focus();
  }
  var gb=$("gridbox");
  if (gb){
    gb.oninput=function(){ pending=this.value; };
    gb.onkeydown=function(e){
      if (e.key==="Enter"){ e.preventDefault(); advance(); }
      if (e.key==="ArrowLeft" && !this.value){ e.preventDefault(); goBack(); }
    };
    gb.focus();
  }
  var nx=$("next"); if (nx) nx.onclick=advance;
  var pv=$("prev"); if (pv) pv.onclick=goBack;

  var tabs=app.querySelectorAll(".ptab[data-tab]");
  for (var t=0;t<tabs.length;t++){
    tabs[t].onclick=function(){
      var tk=this.getAttribute("data-tab");
      if (textState(tk)==="done"){
        ask("That text is closed",
            "You have already finished the questions for “"+DATA.texts[tk].label+
            "”, so it cannot be reopened.", "OK", function(){});
        return;
      }
      viewText=tk; paneReset=true; render();
    };
  }
  var bc=$("backcur");
  if (bc) bc.onclick=function(){ viewText=queue[idx].text; render(); };

  var pr=$("print"); if (pr) pr.onclick=printSheet;
  var cp=$("copy"); if (cp) cp.onclick=copyResults;
  var st=$("student");
  if (st) st.oninput=function(){
    var s=$("phname"); if(s) s.textContent=this.value?this.value:"—"; };
  var rs=$("restart");
  if (rs) rs.onclick=function(){
    ask("Start over?","This clears every answer and returns you to the start screen.",
        "Start over", function(){
      wipe(); queue=[]; idx=0; answers={}; elim={}; pending=null; held=null;
      elapsed=0; viewText=null; plan=null; mode="start"; stopTicker(); render();
    });
  };
}

function syncView(){
  var it=queue[idx];
  viewText = it && it.text ? it.text : null;
}

function begin(secKeys){
  wipe();
  queue=[]; answers={}; idx=0; elapsed=0; pending=null;
  secKeys.forEach(function(k){
    var s=secOf(k);
    if (s) s.items.forEach(function(it){ queue.push(it); });
  });
  elim={}; held=null;
  secStart=0; mode="secintro"; syncView(); startTicker(); render();
}

function step(to){
  var prevSec=queue[idx].sec;
  idx=to;
  pending = answers[key(queue[idx])] || null;
  var prevText = viewText;
  syncView();
  paneReset = (viewText !== prevText);
  save();
  if (queue[idx].sec!==prevSec) mode="secintro";
  render();
  if (mode==="test") window.scrollTo(0,0);
}

function goBack(){
  var bd=setBounds(idx);
  if (idx<=bd[0]) return;                       // never leave the current set
  if (pending) answers[key(queue[idx])]=pending;
  step(idx-1);
}

function advance(){
  var it=queue[idx];
  if (pending != null && pending !== "" && pending !== blankFor(it))
    answers[key(it)]=pending;
  held=null;
  var bd=setBounds(idx), a=bd[0], b=bd[1];

  if (idx===queue.length-1){
    ask("Finish the test?",
        "You will see your full score report. You cannot return to the questions.",
        "Finish test", finish);
    return;
  }
  // inside a set, with questions still ahead of us: just move on, nothing locks
  if (idx<b){ step(idx+1); return; }

  // at the end of a multi-question set: confirm, because this closes the set
  if (b>a){
    var blank=setBlanks(a,b), n=b-a+1;
    ask("Submit this set?",
        (blank
          ? "You have left "+blank+" of these "+n+" questions blank. "
          : "All "+n+" questions are answered. ")+
        "Submitting closes the set and its text. You cannot come back to it.",
        "Submit set", function(){ step(b+1); });
    return;
  }
  step(idx+1);
}

function finish(){ stopTicker(); mode="results"; save(); render(); }


/* ============================================================ highlighter */
var HL = {};              /* HL[region] = [[start,end], ...] over the region's text */
var hlBar = null;
var hlDrag = null;

function hlRegionOf(n){
  while (n){ if (n.nodeType===1 && n.getAttribute && n.getAttribute("data-hl")!=null) return n;
             n = n.parentNode; }
  return null;
}
function hlTextNodes(root){
  var out=[], w=document.createTreeWalker(root, 4, null, false), n;
  while ((n = w.nextNode())) out.push(n);
  return out;
}
function hlOffset(root, node, off){
  if (node.nodeType===1){                       /* selection landed on an element */
    var kids = hlTextNodes(node);
    if (!kids.length) return -1;
    node = off >= node.childNodes.length ? kids[kids.length-1] : kids[0];
    off  = off >= node.nodeValue.length ? node.nodeValue.length : 0;
  }
  var ns = hlTextNodes(root), t = 0;
  for (var i=0;i<ns.length;i++){
    if (ns[i] === node) return t + off;
    t += ns[i].nodeValue.length;
  }
  return -1;
}
function hlMerge(list){
  list.sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  var out=[];
  for (var i=0;i<list.length;i++){
    var last = out[out.length-1];
    if (last && list[i][0] <= last[1]) last[1] = Math.max(last[1], list[i][1]);
    else out.push([list[i][0], list[i][1]]);
  }
  return out;
}
function hlPaint(root){
  var reg = root.getAttribute("data-hl"), rs = HL[reg];
  if (!rs || !rs.length) return;
  var ns = hlTextNodes(root), pos = 0;
  for (var i=0;i<ns.length;i++){
    var node = ns[i], txt = node.nodeValue, s = pos, e = pos + txt.length;
    pos = e;
    if (!txt.length || !node.parentNode) continue;
    var cuts = [];
    for (var j=0;j<rs.length;j++){
      var a = Math.max(rs[j][0], s), b = Math.min(rs[j][1], e);
      if (b > a) cuts.push([a-s, b-s, j]);
    }
    if (!cuts.length) continue;
    var frag = document.createDocumentFragment(), last = 0;
    for (var k=0;k<cuts.length;k++){
      if (cuts[k][0] > last) frag.appendChild(document.createTextNode(txt.slice(last, cuts[k][0])));
      var mk = document.createElement("mark");
      mk.className = "hl";
      mk.setAttribute("data-hlr", cuts[k][2]);
      mk.setAttribute("title", "Click to remove this highlight");
      mk.appendChild(document.createTextNode(txt.slice(cuts[k][0], cuts[k][1])));
      frag.appendChild(mk);
      last = cuts[k][1];
    }
    if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}
function hlPaintAll(){
  var rs = document.querySelectorAll("[data-hl]");
  for (var i=0;i<rs.length;i++) hlPaint(rs[i]);
}
function hlHideBar(){
  if (hlBar && hlBar.parentNode) hlBar.parentNode.removeChild(hlBar);
  hlBar = null;
}
function hlShowBar(rect, label, fn){
  hlHideBar();
  hlBar = document.createElement("div");
  hlBar.className = "hlbar";
  var b = document.createElement("button");
  b.type = "button";
  b.appendChild(document.createTextNode(label));
  b.onmousedown = function(ev){ ev.preventDefault(); };
  b.onclick = function(ev){ ev.preventDefault(); ev.stopPropagation(); fn(); hlHideBar(); };
  hlBar.appendChild(b);
  document.body.appendChild(hlBar);
  var sy = window.pageYOffset || document.documentElement.scrollTop || 0;
  var sx = window.pageXOffset || document.documentElement.scrollLeft || 0;
  var top = rect.top + sy - hlBar.offsetHeight - 8;
  if (top < sy + 4) top = rect.bottom + sy + 8;
  var left = rect.left + sx + rect.width/2 - hlBar.offsetWidth/2;
  var max = (document.documentElement.clientWidth || 900) - hlBar.offsetWidth - 6;
  hlBar.style.top  = Math.round(top) + "px";
  hlBar.style.left = Math.round(Math.max(6, Math.min(left, max))) + "px";
}
function hlFromSelection(sel){
  var rg = sel.getRangeAt(0);
  var root = hlRegionOf(rg.startContainer);
  if (!root || root !== hlRegionOf(rg.endContainer)){ hlHideBar(); return; }
  var s = hlOffset(root, rg.startContainer, rg.startOffset);
  var e = hlOffset(root, rg.endContainer, rg.endOffset);
  if (s < 0 || e < 0) { hlHideBar(); return; }
  var lo = Math.min(s,e), hi = Math.max(s,e);
  if (hi - lo < 2){ hlHideBar(); return; }
  var reg = root.getAttribute("data-hl");
  hlShowBar(rg.getBoundingClientRect(), "Highlight", function(){
    HL[reg] = hlMerge((HL[reg] || []).concat([[lo, hi]]));
    if (sel.removeAllRanges) sel.removeAllRanges();
    save(); render();
  });
}
function hlRemoveBar(m){
  var root = hlRegionOf(m);
  if (!root) { hlHideBar(); return; }
  var reg = root.getAttribute("data-hl"), j = parseInt(m.getAttribute("data-hlr"), 10);
  hlShowBar(m.getBoundingClientRect(), "Remove highlight", function(){
    if (HL[reg]) { HL[reg].splice(j, 1); if (!HL[reg].length) delete HL[reg]; }
    save(); render();
  });
}

/* mouseup and click both end the same gesture, and click always comes second, so the
   two share one debounced handler rather than fighting over the popup */
var hlMark = null, hlPend = null;
function hlGesture(){
  hlPend = null;
  var sel = window.getSelection();
  if (sel && !sel.isCollapsed && sel.rangeCount){ hlMark = null; hlFromSelection(sel); return; }
  if (hlMark){ var m = hlMark; hlMark = null; hlRemoveBar(m); return; }
  hlHideBar();
}
function hlSchedule(){
  if (hlPend) clearTimeout(hlPend);
  hlPend = setTimeout(hlGesture, 0);
}
function hlOnBar(t){ return t && t.parentNode && t.parentNode.className === "hlbar"; }

document.addEventListener("mouseup",  function(ev){ if (!hlOnBar(ev.target)) hlSchedule(); }, false);
document.addEventListener("touchend", function(ev){ if (!hlOnBar(ev.target)) hlSchedule(); }, false);

/* a click on a highlight offers to remove it, and never reaches the choice beneath */
document.addEventListener("click", function(ev){
  var m = ev.target;
  while (m && m.nodeType===1 && m.tagName !== "MARK"){
    if (m.getAttribute && m.getAttribute("data-hl") != null){ m = null; break; }
    m = m.parentNode;
  }
  if (!m || m.nodeType !== 1 || m.tagName !== "MARK") return;
  ev.preventDefault(); ev.stopPropagation();
  hlMark = m;
  hlSchedule();
}, true);

/* dragging across an answer choice selects text; it must not also pick that choice */
document.addEventListener("mousedown", function(e){ hlDrag = [e.clientX, e.clientY]; }, true);
document.addEventListener("click", function(e){
  if (!hlDrag) return;
  var dx = e.clientX - hlDrag[0], dy = e.clientY - hlDrag[1];
  hlDrag = null;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4){
    var sel = window.getSelection();
    if (sel && !sel.isCollapsed){ e.preventDefault(); e.stopPropagation(); }
  }
}, true);

render();
})();
</script>
</body>
